spring.application.name=InstaMetrics
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# Use Render's PORT env var if present, otherwise default to 8080 for local dev.
server.port=${PORT:8080}

# CORS allowed origin, read from env variable ALLOWED_ORIGIN on Render.
# Default is localhost:4200 for local Angular dev.
app.cors.allowed-origin=${ALLOWED_ORIGIN:http://localhost:4200}